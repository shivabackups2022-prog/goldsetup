name: signals

on:
  schedule:
    - cron: "*/5 * * * *"     # GitHub's minimum interval; runs can be a few minutes late
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write              # needed to save state.json

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run signal bot
        run: python signal_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOL: ${{ vars.SYMBOL }}
          TIMEFRAMES: ${{ vars.TIMEFRAMES }}
          EMA_TREND: ${{ vars.EMA_TREND }}
          EMA_FAST: ${{ vars.EMA_FAST }}
          EMA_SLOW: ${{ vars.EMA_SLOW }}

      - name: Save state
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
